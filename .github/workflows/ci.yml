name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: "just check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: "Cache the IFC sources"
        uses: actions/cache@v4
        with:
          path: target/ifc-src
          key: ifc-${{ hashFiles('ifc-version') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check

  reuse:
    name: "Licences (REUSE)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5
